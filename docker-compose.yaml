version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: credit-postgres
    environment:
      POSTGRES_DB: credit_deal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - credit-network

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: credit-zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - credit-network
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data

  kafka:
    image: wurstmeister/kafka
    container_name: credit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ADVERTISED_PORT: 9092           # явно фиксируем порт
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LOG_DIRS: /kafka/kafka-logs     # настройка логов
      KAFKA_CREATE_TOPICS: "finish-registration:1:1,create-documents:1:1,send-documents:1:1,send-ses:1:1,credit-issued:1:1,application-denied:1:1"
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"  # ✅ ограничиваем память
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:+DisableExplicitGC"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kafka_data:/kafka/kafka-logs        #  сохраняем логи в volume
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - credit-network

  conveyor:
    build: ./conveyor
    container_name: credit-conveyor
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - credit-network
    depends_on:
      - kafka
      - postgres

  deal:
    build: ./deal
    container_name: credit-deal
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_deal
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CONVEYOR_URL: ${CONVEYOR_URL}
    networks:
      - credit-network
    depends_on:
      - conveyor
      - postgres
      - kafka

  application:
    build: ./application
    container_name: credit-application
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DEAL_URL: http://deal:8081
    networks:
      - credit-network
    depends_on:
      - deal

  dossier:
    build: ./dossier
    container_name: credit-dossier
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - credit-network
    depends_on:
      - kafka

  gateway:
    build: ./gateway
    container_name: credit-gateway
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVICES_APPLICATION_URL: http://application:8082
      SERVICES_DEAL_URL: http://deal:8081
    networks:
      - credit-network
    depends_on:
      - application
      - deal

  prometheus:
    image: prom/prometheus:latest
    container_name: credit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - credit-network

  grafana:
    image: grafana/grafana:latest
    container_name: credit-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - credit-network

networks:
  credit-network:
    driver: bridge

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:
  prometheus_data:
  grafana_data: