version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: credit-postgres
    environment:
      POSTGRES_DB: credit_deal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - credit-network

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: credit-zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped
    networks:
      - credit-network
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data # Сохраняем состояние Zookeeper

  kafka:
    image: wurstmeister/kafka
    container_name: credit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ADVERTISED_PORT: 9092  # Явно фиксируем порт, чтобы не было ошибки INT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "finish-registration:1:1,create-documents:1:1,send-documents:1:1,send-ses:1:1,credit-issued:1:1,application-denied:1:1"
      KAFKA_LOG_DIRS: /kafka/kafka-logs # Настройки логов (опционально, для надежности):
    volumes:
#      - /var/run/docker.sock:/var/run/docker.sock
      - kafka_data:/kafka # Вот здесь будут лежать твои сообщения и топики
    restart: unless-stopped
    depends_on:
      - zookeeper
    networks:
      - credit-network

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:

networks:
  credit-network:
    driver: bridge